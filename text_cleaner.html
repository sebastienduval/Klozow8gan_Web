<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convertisseur de textes.</title>
    <link rel="stylesheet" href="klozow8gan.css">
    <a href="index.html">Acceuil</a>
</head>
<body>

    <div class="container">
        <h2>Convertisseur de textes</h2>
        
        <!-- JSON Configuration Area -->
        <div class="form-group">
            <label for="json-rules">Règles de conversion (Format JSON):</label>
            <textarea id="json-rules" class="code" rows="7">
            </textarea>
        </div>
        
        <!-- Input Area -->
        <div class="form-group">
            <label for="input-text">Texte d'entrée:</label>
            <textarea id="input-text" rows="6" placeholder="Type or paste your text here..."></textarea>
        </div>
        
        <!-- Action Button -->
        <button id="convert-btn">Convertir</button>
        
        <!-- Output Area -->
        <div class="form-group">
            <label for="output-text">Texte de sortie:</label>
            <textarea id="output-text" rows="6" readonly placeholder="Your converted text will appear here..."></textarea>
        </div>
    </div>

    <script>
        document.getElementById('convert-btn').addEventListener('click', () => {
            const jsonText = document.getElementById('json-rules').value;
            const inputText = document.getElementById('input-text').value;
            const outputArea = document.getElementById('output-text');
            
            let rules;
            
            // 1. Try to parse the JSON securely
            try {
                rules = JSON.parse(jsonText);
            } catch (e) {
                alert("Invalid JSON format in the conversion rules. Please check your syntax.");
                return;
            }

            let result = inputText;
            
            // 2. Sort the keys by length (longest first)
            // This ensures multi-character strings are replaced before single characters.
            // (e.g., replacing "apple" before "a").
            const sortedKeys = Object.keys(rules).sort((a, b) => b.length - a.length);
            
            // 3. Apply the replacements
            for (const key of sortedKeys) {
                // Using split and join is a safe way to replace all occurrences globally
                // without needing to escape special characters for Regular Expressions.
                result = result.split(key).join(rules[key]);
            }
            
            // 4. Output the result
            outputArea.value = result;
        });

        let filePath = './tc_laurent_to_charland.json';
        fetch(filePath)
        .then(response => {
            if (!response.ok) throw new Error('File not found');
            return response.text();
        })
        .then(text => {
            document.getElementById('json-rules').value = text;
        })
        .catch(error => console.error('Error:', error));
    </script>
</body>
</html>
