<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convertisseur de textes.</title>
    <link rel="stylesheet" href="klozow8gan.css">
    <a href="index.html">Acceuil</a>
</head>
<body>

    <div class="container">
        <h2>Convertisseur de textes</h2>
        
        <!-- JSON Configuration Area -->
        <div class="form-group">
            <label for="json-rules">Règles de conversion (Format JSON):</label>
            <label class="small">Ajouter ^ pour marquer le début d'un mot ou $ pour la fin d'un mot.</label>
            <textarea id="json-rules" class="code" rows="7">
            </textarea>
        </div>
        
        <!-- Input Area -->
        <div class="form-group">
            <label for="input-text">Texte d'entrée:</label>
            <textarea id="input-text" rows="6" placeholder="Type or paste your text here..."></textarea>
        </div>
        
        <!-- Action Button -->
        <button id="convert-btn">Convertir</button>
        
        <!-- Output Area -->
        <div class="form-group">
            <label for="output-text">Texte de sortie:</label>
            <textarea id="output-text" rows="6" readonly placeholder="Your converted text will appear here..."></textarea>
        </div>
    </div>

    <script>
        // Helper function to escape special characters for Regex
        function escapeRegExp(string) {
            return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }

        function ParseAndCategorizeRules(rules)
        {
            // 1. Parse and categorize the rules
            let parsedRules = [];
            for (let key in rules) {
                let originalKey = key;
                let searchString = key;
                let isStart = false;
                let isEnd = false;

                // Check for start of word anchor
                if (searchString.startsWith('^')) {
                    isStart = true;
                    searchString = searchString.slice(1);
                }
                // Check for end of word anchor
                if (searchString.endsWith('$')) {
                    isEnd = true;
                    searchString = searchString.slice(0, -1);
                }

                parsedRules.push({
                    search: searchString,
                    replacement: rules[originalKey],
                    isStart: isStart,
                    isEnd: isEnd,
                    length: searchString.length
                });
            } 
            return parsedRules;             
        }

        function ConvertText(rules, inputText)
        {
            let result = inputText;
            
            // Define what counts as a word separator (Spaces, punctuation, newlines)
            const separators = '\\s.,;:!?\\n\\r';

            // 3. Apply the rules iteratively
            for (const rule of rules) 
            {
                if (!rule.search) continue;

                let escapedSearch = escapeRegExp(rule.search);
                let regexPattern = '';

                // Add regex lookbehinds/lookaheads if boundaries were requested
                // This checks for the boundary WITHOUT deleting the space or punctuation
                if (rule.isStart) {
                    regexPattern += `(?<=^|[${separators}])`; 
                }
                
                regexPattern += escapedSearch;
                
                if (rule.isEnd) {
                    regexPattern += `(?=$|[${separators}])`;
                }

                // Create a global (g), case-insensitive (i) regular expression
                const regex = new RegExp(regexPattern, 'gi');

                // Apply replacement with a function to preserve casing
                result = result.replace(regex, (match) => {
                    const repl = rule.replacement;
                    if (!repl) return repl; 

                    const firstChar = match.charAt(0);
                    
                    // Check if the first character of the matched text is uppercase or lowercase
                    const isUpper = firstChar === firstChar.toUpperCase() && firstChar !== firstChar.toLowerCase();
                    const isLower = firstChar === firstChar.toLowerCase() && firstChar !== firstChar.toUpperCase();

                    if (isUpper) {
                        return repl.charAt(0).toUpperCase() + repl.slice(1);
                    } else if (isLower) {
                        return repl.charAt(0).toLowerCase() + repl.slice(1);
                    }
                    
                    return repl; // Fallback
                });
            }

            return result;
        }

        document.getElementById('convert-btn').addEventListener('click', () => {
            const jsonText = document.getElementById('json-rules').value;
            const inputText = document.getElementById('input-text').value;
            const outputArea = document.getElementById('output-text');
            
            let rules;            
            try {
                rules = JSON.parse(jsonText);
            } catch (e) {
                alert("Invalid JSON format in the conversion rules. Please check your syntax.");
                return;
            }

            rules = ParseAndCategorizeRules(rules);

            rules.sort((a, b) => b.length - a.length);

            let result = ConvertText(rules, inputText);
            
            outputArea.value = result;
        });

        let filePath = './tc_laurent_to_charland.json';
        fetch(filePath)
        .then(response => {
            if (!response.ok) throw new Error('File not found');
            return response.text();
        })
        .then(text => {
            document.getElementById('json-rules').value = text;
        })
        .catch(error => console.error('Error:', error));
    </script>
</body>
</html>
