<script>
    function GenerateVerbListWithInfinitive(dictionary)
    {
        var result = [];

        for ( var entry of dictionary )
        {
            if ( entry.Infinitive )
            {
                result.push(entry.Abenaki.toLowerCase());
            }
        }
        return result;
    }

    function GenerateVerbDictionary(verbs)
    {
        var verbDictionary = [];

        const verbIndex = getRandomInt(verbs.length);
        const verb = verbs[verbIndex];
        var entry = findEntry(dictionary, 'Abenaki', verb);
        if ( entry )
        {
            for ( const temps of tempsDeConjugaison )
            {
                var conjugations = Conjugate(verb, temps, "VAI");
                for ( var conjugation of conjugations )
                {
                    verbDictionary.push({"Abenaki":conjugation.Spelling, "French":entry.Infinitive + " (" + personsDescription[conjugation.Index] + " " + descriptionDeTempsDeConjugaison.get(temps) + ")."});
                }
            }
        }

        return verbDictionary;
    }


    function onGenerateNewQuestion()
    {   
        var verbs = GenerateVerbListWithInfinitive(dictionary);
        verbDictionary = GenerateVerbDictionary(verbs);

        var wordList = [];
        for ( var definition of verbDictionary )
        {
            wordList.push(definition.Abenaki.toLowerCase());
        }        
        generateQuestionFromAbenakiWordList(verbDictionary, wordList);
    }
</script>

<h1>Nadodemow8ganal (Questions)</h1>
<h2>Quiz de conjugaison</h2>

<script>
    addGameHtmlTo("body", 'onGenerateNewQuestion()');
    formatDifficulties(dictionary, "difficulties");
    onGenerateNewQuestion();
</script>
