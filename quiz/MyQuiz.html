<h1>Mon quiz</h1>
<br> 
</br>

<p>Écris tous les mots que tu veux apprendre séparés d'une virgule.</p>
<textarea id="words" rows="4" cols="50">Awasos, Minowis, Sata, Pananas</textarea>

<script>
    function getWordList()
    {
        let words = document.getElementById('words').value;
        let wordList = words.split(',').map(word => word.trim());
        return wordList; 
    }    
    function onGenerateNewQuestion()
    {   
        generateQuestionFromAbenakiWordList(dictionary, getWordList());
        generateWordTable("word_table", dictionary, getWordList());        
    }
</script>
</br>
</br>
<input type="button" id="generate_button" value='Commencer' onclick="onGenerateNewQuestion();"/>

<p id="quiz"></p>
<br> 
</br>
<p id="toggle"></p>
<p id="word_table" hidden=true></p>
<script>  
    addGameHtmlTo("quiz", 'onGenerateNewQuestion()');
    formatDifficulties(dictionary, "difficulties");
    onGenerateNewQuestion();
</script>

</body>
