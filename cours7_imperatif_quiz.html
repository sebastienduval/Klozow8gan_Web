<script>
        const verbDictionary = [{"Abenaki":"alosa","French":"Va (indéterminé)"},
                                {"Abenaki":"alosada","French":"Allons (indéterminé)"},
                                {"Abenaki":"alosakw","French":"Allez (indéterminé)"},
                                {"Abenaki":"pmosa","French":"Va (en suivant un plan)"},
                                {"Abenaki":"pmosada","French":"Allons (en suivant un plan)"},
                                {"Abenaki":"pmosakw","French":"Allez (en suivant un plan)"}, 
                                {"Abenaki":"kiosa","French":"Promène-toi"},
                                {"Abenaki":"kiosada","French":"Promenons-nous"},
                                {"Abenaki":"kiosakw","French":"Promenez-vous"},
                                {"Abenaki":"todosa","French":"Passes (sans t'arrêter)"},
                                {"Abenaki":"todosada","French":"Passons (sans nous arrêter)"},
                                {"Abenaki":"todosakw","French":"Passez (sans vous arrêter)"}
                        ];    
    function onGenerateNewQuestion()
    {   
        var wordList = [];
        for ( var definition of verbDictionary )
        {
            wordList.push(definition.Abenaki);
        }        
        if ( getRandomInt(5) == 0 )
        {
            generateHardQuestionFromAbenakiWordList(verbDictionary, wordList);
        }
        else
        {
            generateQuestionFromAbenakiWordList(verbDictionary, wordList);
        }        
    }
</script>
