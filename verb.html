<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conjugaisons</title>
    <link rel="stylesheet" href="klozow8gan.css">
    <a href="index.html">Acceuil</a>    
</head>
<body>

<script src="Dict.json"></script>
<script src="dictionary_utils.js"></script>
<script src="string.js"></script> 
<script src="verb.js"></script> 

<script>
  function onChange()
  {
    ConjugateToHtmlElement('demo');
  }

</script> 

<h1>Conjugaisons</h1>

<h3>Écris un verbe en Abénaki à la première personne du présent pour le conjuguer.</h3>

Suggestions:
<br>
N'saosa
<br>
N'm8ji
<br>
N'namih8
<br>
N'askawito
<br>
N'waj8nem
<br>
<br>
<label for="VerbRoot">Racine du verbe:</label>
<input type="text" id="VerbRoot" value="alosa" oninput="onChange()">
<br>
<label for="Pattern">Choisi un patron:</label>
<select name="Patron" id="Pattern" onchange="onChange()">
  <option value="VAI">VAI</option>
  <option value="VTAi">VTAi</option>
  <option value="VTIi">VTIi</option>
  <option value="VTAd">VTAd</option>
  <option value="VTId">VTId</option>
</select>
<br>
<label for="Tense">Choisi un temps:</label>
<select name="Temps" id="Tense" onchange="onChange()">
  <option value="Présent">Présent</option>
  <option value="Imparfait">Imparfait</option>
  <option value="Passé Composé">Passé Composé</option>
  <option value="Future">Future</option>
  <option value="Conditionnel">Conditionnel</option>
  <option value="Impératif">Impératif</option>
</select>
<br>
<button onclick="onChange()">Conjugue</button>

<p id="demo"></p>

<script>onChange();</script>

</body>
</html>
